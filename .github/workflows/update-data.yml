name: Update market data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Download new 4h candles
        run: python3 scripts/download_data.py --update --years 5 --limit 150
      - name: Stitch Toncoin history onto GRAM
        run: python3 scripts/stitch_gram.py
      - name: Rebuild the draft-plan study
        run: node --experimental-strip-types scripts/build_study.ts
      - name: Commit data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No new candles."
          else
            git commit -m "Update market data"
            git push
          fi
